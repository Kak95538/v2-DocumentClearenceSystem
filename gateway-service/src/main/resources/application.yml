spring:
  cloud:
    gateway:
      routes:

        # ✅ AUTH SERVICE (NO JWT FILTER)
        - id: auth-service
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/auth/**

        # ✅ PAYMENT SERVICE (PROTECTED)
        - id: payment-service
          uri: lb://PAYMENT-SERVICE
          predicates:
            - Path=/payment/**
          filters:
            - JwtAuthFilter

        # ✅ DOCUMENT SERVICE (PROTECTED)
        - id: document-service
          uri: lb://DOCUMENT-SERVICE
          predicates:
            - Path=/documents/**
          filters:
            - JwtAuthFilter

        # ✅ NOTIFICATION SERVICE (OPTIONAL PROTECTION)
        - id: notification-service
          uri: lb://NOTIFICATION-SERVICE
          predicates:
            - Path=/notification/**
          filters:
            - JwtAuthFilter           
eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/